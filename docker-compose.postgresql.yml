# Host networking: docker compose -f docker-compose.yml -f docker-compose.postgresql.yml up -d
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowrate
      POSTGRES_USER: flowrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowrate -d flowrate"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  server:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Database__Provider: PostgreSql
      Database__ConnectionString: Host=127.0.0.1;Port=${POSTGRES_PORT:-5432};Database=flowrate;Username=flowrate
      # Kept out of the connection string so quotes and semicolons in passwords work unchanged.
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

volumes:
  postgres-data:
