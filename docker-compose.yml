name: flowrate

services:
  mediasoup:
    build:
      context: src/Sfu/mediasoup
    image: flowrate/mediasoup:latest
    restart: unless-stopped
    # Host networking: no Docker NAT in the WebRTC path and no bridge for a host firewall to filter
    network_mode: host
    environment:
      # Only the server on this machine talks to the SFU
      GRPC_BIND: 127.0.0.1:50051
      # The address the SFU binds; see RTC_LISTEN_IP in .env
      RTC_LISTEN_IP: ${RTC_LISTEN_IP:-0.0.0.0}
      # Public IP clients reach the SFU at; set it in .env on the server
      RTC_ANNOUNCED_IPS: ${PUBLIC_IP:?set PUBLIC_IP in .env to the server's public IP}
      RTC_PORT: 4433
      # Each worker takes the next port; open the whole range in the host firewall when raising it
      MEDIASOUP_WORKERS: 1
      MEDIASOUP_LOG_LEVEL: error
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(50051,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  server:
    build:
      context: src
      dockerfile: Server/Server.Asp/Dockerfile
    image: flowrate/server:latest
    restart: unless-stopped
    # Host networking, as the SFU; clients need 26666/tcp and 4433/tcp+udp open from outside
    network_mode: host
    extra_hosts:
      - "mediasoup:127.0.0.1"
    depends_on:
      mediasoup:
        condition: service_healthy
    environment:
      # The control panel has no authentication: localhost only unless .env says otherwise
      Orchestrator__ListenIp: ${PANEL_LISTEN_IP:-127.0.0.1}
      # Push is off unless a Firebase key in secrets/ is named in .env
      Push__ServiceAccountPath: ${PUSH_SERVICE_ACCOUNT_FILE:+/run/secrets/flowrate/${PUSH_SERVICE_ACCOUNT_FILE}}
      # Or through a push relay, when there is no key of your own
      Push__RelayUrl: ${PUSH_RELAY_URL:-}
      # Passkeys are off unless .env names the domain users reach the server by
      Fido2__RelyingPartyId: ${PASSKEY_DOMAIN:-}
    volumes:
      - server-data:/data
      - server-logs:/logs
      - ./secrets:/run/secrets/flowrate:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7114 && exec 4<>/dev/tcp/127.0.0.1/26666"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  server-data:
  server-logs:

