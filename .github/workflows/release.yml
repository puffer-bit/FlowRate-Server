# Builds the server package and publishes it as the GitHub pre-release v<version>-dev.<UTC yyMMddHHmm>, run by
# hand from the Actions tab.
#
# The build is build.yml; the release goes on the commit that was built. The description is the one GitHub
# generates (the changes since the previous release).
name: Pre-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: FlowRateServer-${{ needs.build.outputs.version }}-*
          path: assets
          merge-multiple: true

      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION-dev.$(date -u +%y%m%d%H%M)"
          ls -l assets
          gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "FlowRate server ${tag#v}" --generate-notes
          echo "### [FlowRate server ${tag#v}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"
