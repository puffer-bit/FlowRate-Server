# Tests the server and SFU and builds the control panel, including before a release.
#
# The .NET tests need neither Docker nor the SFU: it is faked behind its gateway.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Tests
    # Pinned so that a runner image migration does not change the build unannounced
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        working-directory: src
        run: bash ../.github/scripts/test-dotnet.sh FlowRateServer.sln

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ubuntu-24.04
          path: TestResults
          if-no-files-found: warn

  web:
    name: Validate (${{ matrix.project }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: src/Sfu/mediasoup
            command: npm test
          - project: src/Web/admin-panel
            command: npm run build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Validate
        working-directory: ${{ matrix.project }}
        run: |
          npm ci
          ${{ matrix.command }}
